apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.willieaustin.shift.nativecrypto'
version = '2.0.0'

android {
  namespace "com.willieaustin.shift.nativecrypto"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)
  ndkVersion safeExtGet("ndkVersion", "26.1.10909125")

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)

    // Compile vendored PQClean ML-KEM-768 + JNI wrapper into libmlkem768.so.
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        arguments "-DANDROID_STL=c++_shared"
        targets "mlkem768"
      }
    }
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${safeExtGet('kotlinVersion', '1.9.24')}"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
